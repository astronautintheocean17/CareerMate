name: careermate
description: "CareerMate — Portal for Academia–Industry Collaboration for Skill Mapping, Internships and Placement (SIH26044)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/icons/careermate-icon.png

# ---------------------------------------------------------------------------
#  flutter_launcher_icons — TOP-LEVEL key, NOT nested under flutter:
# ---------------------------------------------------------------------------
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/icons/careermate-icon.png"
  web:
    generate: true
    image_path: "assets/images/icons/careermate-icon.png"
    background_color: "#FFFFFF"
    theme_color: "#1A4FD6"
  windows:
    generate: true
    image_path: "assets/images/icons/careermate-icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/images/icons/careermate-icon.png"